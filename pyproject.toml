[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonshot-profit-research"
version = "0.1.1"
description = "Prospective Solana market research and conditional paper trading; no transactions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
meme-research = "meme_research.cli:main"

[tool.setuptools.packages.find]
include = ["meme_research*"]
